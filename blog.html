<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blog — Cultivate Eden</title>
<meta name="description" content="Writing and reflections from Cultivate Eden on Scripture, communion with God, and the call to be reconciled to Eden.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="site-header">
  <div class="nav-wrap">
    <a href="index.html" class="brand">
      <span class="brand-name">Cultivate Eden</span>
      <span class="brand-tag">#CultivateEden</span>
    </a>
    <nav class="site-nav">
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="cultivate-nights.html">Cultivate Nights</a>
      <a href="shabbat-series.html">Shabbat Series</a>
      <a href="blog.html" class="active">Blog</a>
      <a href="contact.html">Contact</a>
    </nav>
  </div>
</header>

<section class="hero" style="padding: 70px 0 60px;">
  <div class="container">
    <span class="section-label" style="color: var(--gold);">Writing</span>
    <h1>The Blog</h1>
    <p class="lead">Reflections on Scripture, communion, and the long walk back to the garden.</p>
  </div>
</section>

<section>
  <div class="container">
    <div id="blog-post-list" class="post-list">
      <p>Loading posts…</p>
    </div>
  </div>
</section>

<footer class="site-footer">
  <div class="container">
    <span class="brand-name">Cultivate Eden</span>
    <span class="foot-tag">#CultivateEden</span>
    <p style="margin-top: 18px; color: #cfd6c8;">&copy; 2026 Cultivate Eden. Pleading with all to be reconciled to Eden.</p>
  </div>
</footer>

<script src="assets/site-config.js"></script>
<script src="assets/blog.js"></script>
<script>
  (function () {
    var listEl = document.getElementById("blog-post-list");

    if (!window.CultivateBlog || !window.CultivateBlog.isConfigured()) {
      listEl.innerHTML =
        '<div class="info-box">' +
        "<h3 style=\"margin-bottom: 10px;\">Almost there</h3>" +
        "<p>The blog will show posts here once <code>assets/site-config.js</code> has your GitHub username and repo name filled in. See the README for the two-line fix.</p>" +
        "</div>";
      return;
    }

    window.CultivateBlog.fetchAllPosts()
      .then(function (posts) {
        if (!posts.length) {
          listEl.innerHTML =
            '<div class="info-box">' +
            "<h3 style=\"margin-bottom: 10px;\">No posts yet</h3>" +
            '<p>New writing will show up here as soon as it\'s published from <a href="/admin/">/admin</a>.</p>' +
            "</div>";
          return;
        }

        listEl.innerHTML = posts
          .map(function (post, i) {
            var thumb = post.image
              ? '<a href="post.html?slug=' + encodeURIComponent(post.slug) + '">' +
                '<img class="post-preview-image" src="' + post.image + '" alt="" loading="lazy"></a>'
              : "";
            return (
              '<div class="post-preview reveal' + (i < 3 ? " reveal-delay-" + (i + 1) : "") + '">' +
              thumb +
              '<span class="post-date">' + window.CultivateBlog.formatDate(post.date) + "</span>" +
              '<h3><a href="post.html?slug=' + encodeURIComponent(post.slug) + '">' + post.title + "</a></h3>" +
              "<p>" + post.excerpt + "</p>" +
              '<p><a href="post.html?slug=' + encodeURIComponent(post.slug) + '">Read the full post &rarr;</a></p>' +
              "</div>"
            );
          })
          .join("");

        // Fade the freshly inserted posts in (same .reveal utility used elsewhere on
        // the site) — a short delay lets the browser paint the starting state first.
        window.requestAnimationFrame(function () {
          window.setTimeout(function () {
            listEl.querySelectorAll(".reveal").forEach(function (el) {
              el.classList.add("in-view");
            });
          }, 30);
        });
      })
      .catch(function (err) {
        listEl.innerHTML =
          '<div class="info-box">' +
          "<h3 style=\"margin-bottom: 10px;\">Couldn't load posts</h3>" +
          "<p>" + (err && err.message ? err.message : "Something went wrong fetching the blog.") + "</p>" +
          "</div>";
      });
  })();
</script>

</body>
</html>
