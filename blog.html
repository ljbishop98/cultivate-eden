<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blog — Cultivate Eden</title>
<meta name="description" content="Writing and reflections from Cultivate Eden on Scripture, communion with God, and the call to be reconciled to Eden.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="site-header">
  <div class="nav-wrap">
    <a href="index.html" class="brand">
      <span class="brand-name">Cultivate Eden</span>
      <span class="brand-tag">#CultivateEden</span>
    </a>
    <nav class="site-nav">
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="cultivate-nights.html">Cultivate Nights</a>
      <a href="shabbat-series.html">Shabbat Series</a>
      <a href="blog.html" class="active">Blog</a>
      <a href="contact.html">Contact</a>
    </nav>
  </div>
</header>

<section class="hero" style="padding: 70px 0 60px;">
  <div class="container">
    <span class="section-label" style="color: var(--gold);">Writing</span>
    <h1>The Blog</h1>
    <p class="lead">Reflections on Scripture, communion, and the long walk back to the garden.</p>
  </div>
</section>

<section>
  <div class="container">
    <div class="blog-toolbar">
      <div class="blog-search">
        <input type="search" id="blog-search-input" placeholder="Search posts…" aria-label="Search posts">
      </div>
      <div class="blog-view-toggle" role="group" aria-label="Post display style">
        <button type="button" id="view-tiles-btn" class="view-toggle-btn">Tiles</button>
        <button type="button" id="view-list-btn" class="view-toggle-btn">List</button>
      </div>
    </div>
    <div id="blog-post-list" class="post-grid">
      <p>Loading posts…</p>
    </div>
  </div>
</section>

<footer class="site-footer">
  <div class="container">
    <span class="brand-name">Cultivate Eden</span>
    <span class="foot-tag">#CultivateEden</span>
    <p style="margin-top: 18px; color: #cfd6c8;">&copy; 2026 Cultivate Eden. Pleading with all to be reconciled to Eden.</p>
  </div>
</footer>

<script src="assets/site-config.js"></script>
<script src="assets/blog.js"></script>
<script>
  (function () {
    var listEl = document.getElementById("blog-post-list");
    var searchInput = document.getElementById("blog-search-input");
    var tilesBtn = document.getElementById("view-tiles-btn");
    var listBtn = document.getElementById("view-list-btn");

    var VIEW_KEY = "cultivateEdenBlogView";
    var allPosts = [];
    var isLoading = true;
    var currentView = localStorage.getItem(VIEW_KEY) || "tiles";

    function setView(view) {
      currentView = view;
      localStorage.setItem(VIEW_KEY, view);
      tilesBtn.setAttribute("aria-pressed", String(view === "tiles"));
      listBtn.setAttribute("aria-pressed", String(view === "list"));
      listEl.className = view === "tiles" ? "post-grid" : "post-list";
      render();
    }

    tilesBtn.addEventListener("click", function () { setView("tiles"); });
    listBtn.addEventListener("click", function () { setView("list"); });

    searchInput.addEventListener("input", function () { render(); });

    function fadeInResults() {
      window.requestAnimationFrame(function () {
        window.setTimeout(function () {
          listEl.querySelectorAll(".reveal").forEach(function (el) {
            el.classList.add("in-view");
          });
        }, 30);
      });
    }

    function matchesSearch(post, query) {
      if (!query) return true;
      var haystack = (post.title + " " + post.excerpt + " " + post.body).toLowerCase();
      return haystack.indexOf(query) !== -1;
    }

    function tileMarkup(post, i) {
      var image = post.image
        ? '<img class="post-tile-image" src="' + post.image + '" alt="" loading="lazy">'
        : '<div class="post-tile-image placeholder">Cultivate Eden</div>';
      return (
        '<div class="post-tile reveal' + (i < 6 ? " reveal-delay-" + ((i % 3) + 1) : "") + '">' +
        '<a href="post.html?slug=' + encodeURIComponent(post.slug) + '">' + image + "</a>" +
        '<div class="post-tile-body">' +
        '<span class="post-date">' + window.CultivateBlog.formatDate(post.date) + "</span>" +
        '<h3><a href="post.html?slug=' + encodeURIComponent(post.slug) + '">' + post.title + "</a></h3>" +
        "<p>" + post.excerpt + "</p>" +
        '<p><a href="post.html?slug=' + encodeURIComponent(post.slug) + '">Read the full post &rarr;</a></p>' +
        "</div></div>"
      );
    }

    function listMarkup(post, i) {
      var thumb = post.image
        ? '<a href="post.html?slug=' + encodeURIComponent(post.slug) + '">' +
          '<img class="post-preview-image" src="' + post.image + '" alt="" loading="lazy"></a>'
        : "";
      return (
        '<div class="post-preview reveal' + (i < 3 ? " reveal-delay-" + (i + 1) : "") + '">' +
        thumb +
        '<span class="post-date">' + window.CultivateBlog.formatDate(post.date) + "</span>" +
        '<h3><a href="post.html?slug=' + encodeURIComponent(post.slug) + '">' + post.title + "</a></h3>" +
        "<p>" + post.excerpt + "</p>" +
        '<p><a href="post.html?slug=' + encodeURIComponent(post.slug) + '">Read the full post &rarr;</a></p>' +
        "</div>"
      );
    }

    function render() {
      if (isLoading) {
        listEl.innerHTML = "<p>Loading posts…</p>";
        return;
      }

      var query = searchInput.value.trim().toLowerCase();
      var posts = allPosts.filter(function (p) { return matchesSearch(p, query); });

      if (!allPosts.length) {
        listEl.innerHTML =
          '<div class="info-box">' +
          "<h3 style=\"margin-bottom: 10px;\">No posts yet</h3>" +
          '<p>New writing will show up here as soon as it\'s published from <a href="/admin/">/admin</a>.</p>' +
          "</div>";
        return;
      }

      if (!posts.length) {
        listEl.innerHTML =
          '<div class="info-box">' +
          "<h3 style=\"margin-bottom: 10px;\">No posts match “" + searchInput.value + "”</h3>" +
          "<p>Try a different search term.</p>" +
          "</div>";
        return;
      }

      var markupFn = currentView === "tiles" ? tileMarkup : listMarkup;
      listEl.innerHTML = posts.map(markupFn).join("");
      fadeInResults();
    }

    if (!window.CultivateBlog || !window.CultivateBlog.isConfigured()) {
      listEl.innerHTML =
        '<div class="info-box">' +
        "<h3 style=\"margin-bottom: 10px;\">Almost there</h3>" +
        "<p>The blog will show posts here once <code>assets/site-config.js</code> has your GitHub username and repo name filled in. See the README for the two-line fix.</p>" +
        "</div>";
      return;
    }

    setView(currentView);

    window.CultivateBlog.fetchAllPosts()
      .then(function (posts) {
        allPosts = posts;
        isLoading = false;
        render();
      })
      .catch(function (err) {
        isLoading = false;
        listEl.innerHTML =
          '<div class="info-box">' +
          "<h3 style=\"margin-bottom: 10px;\">Couldn't load posts</h3>" +
          "<p>" + (err && err.message ? err.message : "Something went wrong fetching the blog.") + "</p>" +
          "</div>";
      });
  })();
</script>

</body>
</html>
