backend:
  name: git-gateway
  branch: main

# Netlify Identity + Git Gateway (enabled in Netlify site settings) handle login and
# let this editor commit new/edited posts to the GitHub repo — no separate GitHub
# account or token needed for whoever logs in here.

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "posts"
    label: "Blog Posts"
    label_singular: "Blog Post"
    folder: "content/posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    sortable_fields: ["date", "title"]
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Publish Date", name: "date", widget: "datetime", format: "YYYY-MM-DD" }
      - { label: "Header Photo", name: "image", widget: "image", required: false, hint: "Shown at the top of the post and next to it on the blog list. Optional." }
      - { label: "Short Excerpt", name: "excerpt", widget: "text", required: false, hint: "Shown on the blog list page. Optional — the first line of the post is used if left blank." }
      - { label: "Body", name: "body", widget: "markdown" }
